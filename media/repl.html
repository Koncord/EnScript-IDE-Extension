<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{cspNonce}}'">
    <title>EnScript REPL</title>
    <style>
        /* Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--vscode-font-family);
            color: var(--vscode-editor-foreground);
            background-color: var(--vscode-editor-background);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            background-color: var(--vscode-sideBar-background);
            border-bottom: 1px solid var(--vscode-panel-border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            background-color: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--vscode-charts-red);
        }

        .status-dot.connected {
            background-color: var(--vscode-charts-green);
        }

        .module-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-selector label {
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
        }

        /* Form Controls */
        select {
            background-color: var(--vscode-dropdown-background);
            color: var(--vscode-dropdown-foreground);
            border: 1px solid var(--vscode-dropdown-border);
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 12px;
            cursor: pointer;
        }

        select:focus {
            outline: 1px solid var(--vscode-focusBorder);
        }

        button {
            padding: 6px 12px;
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--vscode-font-family);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        button.secondary:hover {
            background-color: var(--vscode-button-secondaryHoverBackground);
        }

        /* Main content area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Action buttons */
        .actions {
            padding: 12px 16px;
            background-color: var(--vscode-editorGroupHeader-tabsBackground);
            border-bottom: 1px solid var(--vscode-panel-border);
            display: flex;
            gap: 8px;
        }

        /* Output area */
        .output-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .output-header {
            padding: 8px 16px;
            background-color: var(--vscode-editorGroupHeader-tabsBackground);
            border-bottom: 1px solid var(--vscode-panel-border);
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: var(--vscode-editor-font-family, 'Consolas', 'Courier New', monospace);
            font-size: 13px;
            line-height: 1.6;
        }

        .output-entry {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid var(--vscode-textBlockQuote-border);
            background-color: var(--vscode-textCodeBlock-background);
        }

        .output-entry.success {
            border-left-color: var(--vscode-charts-green);
        }

        .output-entry.error {
            border-left-color: var(--vscode-charts-red);
        }

        .output-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
            margin-bottom: 6px;
        }

        .output-module {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            background-color: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            font-weight: 600;
        }

        .output-code {
            margin-top: 8px;
            padding: 8px;
            background-color: var(--vscode-editor-background);
            border-radius: 2px;
            border: 1px solid var(--vscode-panel-border);
            white-space: pre-wrap;
            word-break: break-word;
            font-family: var(--vscode-editor-font-family, 'Consolas', 'Courier New', monospace);
        }

        .output-message {
            margin-top: 6px;
            font-size: 12px;
        }

        .empty-output {
            color: var(--vscode-descriptionForeground);
            font-style: italic;
            text-align: center;
            padding: 40px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--vscode-scrollbarSlider-background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--vscode-scrollbarSlider-activeBackground);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--vscode-scrollbarSlider-hoverBackground);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Disconnected</span>
        </div>
        <div class="module-selector">
            <label for="module">Execute on:</label>
            <select id="module">
                <option value="Mission">Mission</option>
                <option value="World">World</option>
                <option value="Game">Game</option>
                <option value="GameLib">GameLib</option>
                <option value="Core">Core</option>
            </select>
        </div>
    </div>

    <div class="content">
        <div class="actions">
            <button id="executeBtn" title="Execute code (Ctrl+Enter)">
                ▶ Execute
            </button>
            <button id="clearInputBtn" class="secondary" title="Clear input">
                🗑 Clear Input
            </button>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span>📊 Execution History</span>
                <span id="executionCount">0 executions</span>
            </div>
            <div class="output-content" id="outputContent">
                <div class="empty-output">No executions yet. Write code in the editor and click Execute.</div>
            </div>
        </div>
    </div>

    <script nonce="{{nonce}}">
        (function() {
            const vscode = acquireVsCodeApi();
            const moduleSelect = document.getElementById('module');
            const executeBtn = document.getElementById('executeBtn');
            const focusEditorBtn = document.getElementById('focusEditorBtn');
            const clearInputBtn = document.getElementById('clearInputBtn');
            const outputContent = document.getElementById('outputContent');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const executionCount = document.getElementById('executionCount');

            let executions = 0;
            let isConnected = false;

            // Execute code from editor
            if (executeBtn) {
                executeBtn.addEventListener('click', executeCode);
            }
            
            function executeCode() {
                if (!isConnected) {
                    addOutputEntry({
                        success: false,
                        message: 'Not connected to DayZ. Start debugging first.',
                        timestamp: new Date().toISOString()
                    });
                    return;
                }

                const module = moduleSelect.value;
                vscode.postMessage({
                    command: 'execute',
                    module: module
                });
            }

            // Focus editor
            if (focusEditorBtn) {
                focusEditorBtn.addEventListener('click', () => {
                    vscode.postMessage({ command: 'focusEditor' });
                });
            }

            // Clear editor
            if (clearInputBtn) {
                clearInputBtn.addEventListener('click', () => {
                    vscode.postMessage({ command: 'clearEditor' });
                });
            }

            // Handle messages from extension
            window.addEventListener('message', event => {
                const message = event.data;
                
                switch (message.command) {
                    case 'result':
                        addOutputEntry(message);
                        break;
                    case 'connectionStatus':
                        updateConnectionStatus(message.connected);
                        break;
                }
            });

            function addOutputEntry(data) {
                // Remove empty state
                const emptyOutput = outputContent.querySelector('.empty-output');
                if (emptyOutput) {
                    emptyOutput.remove();
                }

                const entry = document.createElement('div');
                entry.className = 'output-entry ' + (data.success ? 'success' : 'error');
                
                const time = new Date(data.timestamp).toLocaleTimeString();
                const moduleBadge = data.module ? `<span class="output-module">${data.module}</span>` : '';
                
                entry.innerHTML = `
                    <div class="output-meta">
                        <span>${time} ${moduleBadge}</span>
                        <span>${data.success ? '✓ Success' : '✗ Error'}</span>
                    </div>
                    ${data.code ? `<div class="output-code">${escapeHtml(data.code)}</div>` : ''}
                    <div class="output-message">${escapeHtml(data.message)}</div>
                `;
                
                outputContent.insertBefore(entry, outputContent.firstChild);
                executions++;
                updateExecutionCount();
            }

            function updateConnectionStatus(connected) {
                isConnected = connected;
                if (statusDot && statusText && executeBtn) {
                    if (connected) {
                        statusDot.classList.add('connected');
                        statusText.textContent = 'Connected to DayZ';
                        executeBtn.disabled = false;
                    } else {
                        statusDot.classList.remove('connected');
                        statusText.textContent = 'Not connected';
                        executeBtn.disabled = true;
                    }
                }
            }

            function updateExecutionCount() {
                if (executionCount) {
                    executionCount.textContent = `${executions} execution${executions !== 1 ? 's' : ''}`;
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Notify extension that webview is ready and request connection status
            vscode.postMessage({ command: 'ready' });
        })();
    </script>
</body>
</html>
